[build-system]
requires = ["uv-build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pyrocopy"
version = "0.8.0"
description = "A suite of robust file copying utilities for Python."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Jean-Philippe Steinmetz", email = "caskater47@gmail.com" },
]
license = "MIT"
keywords = ["file", "utilities", "admin", "filesystem", "copy", "move", "mirror", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/caskater4/pyrocopy"

[project.scripts]
pyrocopy = "pyrocopy:main"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**", "CHANGES.txt"]
source-exclude = ["pyproject.toml.orig"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "PLW", "PLR"]
ignore = [
    "EXE001",   # shebang-not-executable – file permissions not enforced here
    "PLR2004",  # magic-value-comparison – test assertions use literal counts
    "PLR0912",  # too-many-branches – existing complex functions
    "PLR0913",  # too-many-arguments – existing public API
    "PLR0915",  # too-many-statements – existing complex functions
    "PLR0917",  # too-many-positional – existing public API
    "PLR0911",  # too-many-return-statements – existing code
    "E501",     # line-too-long – long help strings and chained calls
]

[tool.basedpyright]
pythonVersion = "3.14"
reportAny = "none"
reportUnusedCallResult = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
