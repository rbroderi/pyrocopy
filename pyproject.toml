[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "PLW", "PLR"]
ignore = [
    "EXE001",   # shebang-not-executable – file permissions not enforced here
    "PLR2004",  # magic-value-comparison – test assertions use literal counts
    "PLR0912",  # too-many-branches – existing complex functions
    "PLR0913",  # too-many-arguments – existing public API
    "PLR0915",  # too-many-statements – existing complex functions
    "PLR0917",  # too-many-positional – existing public API
    "PLR0911",  # too-many-return-statements – existing code
    "E501",     # line-too-long – long help strings and chained calls
]

[tool.basedpyright]
pythonVersion = "3.14"
reportAny = "none"
reportUnusedCallResult = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
